   loads the right per-branch cart regardless of whatever km_branch the device
   was left on by the previous user. */
(function applyUrlBranch(){
  try {
    const u = new URLSearchParams(location.search);
    const b = (u.get('branch') || '').toUpperCase();
    const VALID = ['MIAMI','PEMBROKE_PINES','HOLLYWOOD','CORAL_SPRINGS','LASOLAS','WEST_PALM','ALL'];
    if (b && VALID.indexOf(b) >= 0) localStorage.setItem('km_branch', b);
  } catch(e){}
})();

const BRANCH_KEY = "km_branch"; // shared across Kimchi Mart apps
// Cart is per-branch × per-user — each person's order stays isolated.
// No handoff between people — one person owns their order start to finish.
function _userKey() {
  try {
    const me = JSON.parse(localStorage.getItem('chat.me') || 'null');
    const raw = (me && me.name || '').trim();
    if (!raw) return 'UNASSIGNED';
    return raw.replace(/[.#$\[\]\/\s]/g, '_').slice(0, 40);
  } catch (e) { return 'UNASSIGNED'; }
}
// 🆕 2026-06-08 사장님 지시: 모든 지점 공유 카트. 같은 지점 매니저·직원이
//   하나의 카트에 같이 빌드. userKey 무시 → 지점별 _shared 한 카트.
//   (namdaemun 은 localStorage 기반이라 동일 디바이스 내에서만 공유.)
const cartKey = (branchId, userKey) => `ndm_cart_v1__${branchId || ''}___shared`;

// 🔁 상품 이름·탭을 바꾸면 장바구니 키(섹션:상품명)가 달라져 담아둔 수량이 화면에서 사라진다.
//   2026-09-20 실제 발생(배 선물 9P→8PC, 연겨자·계란·밥솥·땡큐백 이동). 옛 키를 새 키로 잇는다.
//   ⚠️ 앞으로 en(이름)이나 탭(cat)을 바꿀 때는 반드시 여기에 한 줄 추가할 것.
const KEY_ALIASES = {
  'veg:KOREAN PEAR GIFT 9P'                  : 'veg:KOREAN PEAR GIFT 8PC',
  'ndmgro:PREPARED MUSTARD'                  : 'ndmgro:OTG PREPARED MUSTARD 24/100G',
  'ndmgro:SOY SAUCE FOR EGG DISHES 200 ML/12': 'ndmgro:SP SOY SAUCE FOR EGG DISHES 200ML/12',
  'ndmsupply:SUPPLY MEAT PAD *** return'     : 'ndmsupply:SUPPLY MEAT PAD 4000EA',
  'ndmgro:CR-3032 (VIOLET + STS) RICE COOKER': 'ndmsupply:CR-3032 (VIOLET + STS) RICE COOKER',
  'ndmgro:THANK YOU BAG'                     : 'ndmsupply:THANK YOU BAG',
  'ndmgro:EGG JUMBO CT 12DZ'                 : 'meat:EGG JUMBO CT 12DZ',
  'ndmgro:EGG XL 30DZ'                       : 'meat:EGG XL 30DZ',
  'ndmgro:QUAIL EGG CAN'                     : 'meat:QUAIL EGG 24PC/20',
  'ndmgro:MUSTARD POWDER OTG 300G/12CT (Return)': 'ndmgro:OTG MUSTARD POWDER 300G/12CT',
  'ndmgro:OTG MUSTARD POWDER 300G/12CT (Return)': 'ndmgro:OTG MUSTARD POWDER 300G/12CT',
};
function migrateQty(q){
  var out = {}, moved = 0;
  Object.keys(q || {}).forEach(function(k){
    var nk = KEY_ALIASES[k] || k;
    if (nk !== k) moved++;
    out[nk] = (out[nk] || 0) + (+q[k] || 0);
  });
  if (moved) console.info('[ndm] 장바구니 옛 이름 ' + moved + '건 이어받음');
  return out;
}

// ============ STATE ============
// Shared (not per-branch): prices, priceDate, activeSection/sub (UI navigation)
// Per-branch × per-user (isolated): qty
const SHARED_KEY = "ndm_app_v1";
const DEFAULT_PRICE_DATE = "2026-04-25";
let state = loadState();

function loadState() {
  let branchId = "";
  try { branchId = localStorage.getItem(BRANCH_KEY) || ""; } catch {}
  let shared = {};
  try { shared = JSON.parse(localStorage.getItem(SHARED_KEY)) || {}; } catch {}
  let qty = {};
  if (branchId) {
    try { qty = migrateQty(JSON.parse(localStorage.getItem(cartKey(branchId, _userKey()))) || {}); } catch {}
  }
  return {
    activeSection: shared.activeSection || "veg",
    activeSub: shared.activeSub || "all",
    search: "",
    qty,
    prices: shared.prices || {},
    // Newer DEFAULT (deploy-time constant) wins over a stale localStorage
    // priceDate so a fresh price upload doesn't leave the date frozen on
    // every browser that ever opened the page.
    priceDate: (shared.priceDate && shared.priceDate > DEFAULT_PRICE_DATE) ? shared.priceDate : DEFAULT_PRICE_DATE,
    branchId,
  };
}
function saveState() {
  // 🛒 폰↔PC 공유 — 로컬 저장은 그대로 두고, 수량만 클라우드에도 올린다
  try { if (typeof window.__ndmPushCart === 'function') window.__ndmPushCart(state.qty); } catch(e){}
  localStorage.setItem(SHARED_KEY, JSON.stringify({
    activeSection: state.activeSection, activeSub: state.activeSub,
    prices: state.prices, priceDate: state.priceDate,
  }));
  if (state.branchId) {
    localStorage.setItem(cartKey(state.branchId, _userKey()), JSON.stringify(state.qty));
  }
}

function setBranch(newId) {
  if (!BRANCH_BY_ID[newId]) return;
  const user = _userKey();
  // Save outgoing branch×user qty
  if (state.branchId) {
    localStorage.setItem(cartKey(state.branchId, user), JSON.stringify(state.qty));
  }
  state.branchId = newId;
  try { localStorage.setItem(BRANCH_KEY, newId); } catch {}
  // Load incoming branch×user qty
  try {
    state.qty = migrateQty(JSON.parse(localStorage.getItem(cartKey(newId, user))) || {});
  } catch {
    state.qty = {};
  }
  updateBranchUI();
  renderContent();
  updateSummary();
  // 🛒 지점이 바뀌면 그 지점 공유 카트로 다시 연결
  try { if (typeof window.__ndmCartResub === 'function') window.__ndmCartResub(); } catch(e){}
}

function updateBranchUI() {
  const btn = document.getElementById("branchBtn");
  const lbl = document.getElementById("branchLabel");
  if (state.branchId && BRANCH_BY_ID[state.branchId]) {
    const b = BRANCH_BY_ID[state.branchId];
    lbl.textContent = `📍 ${b.en} / ${b.ko}`;
    btn.classList.remove("unset");
  } else {
    lbl.textContent = "⚠️ Select branch / 지점 선택";
    btn.classList.add("unset");
  }
  const modalBranch = document.getElementById("modalBranch");
  if (modalBranch) {
    modalBranch.textContent = state.branchId
      ? `📍 ${BRANCH_BY_ID[state.branchId].en} / ${BRANCH_BY_ID[state.branchId].ko}`
      : "No branch / 지점 미선택";
  }
}

function openBranchModal() {
  const grid = document.getElementById("branchGrid");
  grid.innerHTML = BRANCHES.map(b => {
    const cart = (function() { try { return JSON.parse(localStorage.getItem(cartKey(b.id, _userKey()))) || {}; } catch { return {}; } })();
    const count = Object.values(cart).filter(v => v > 0).length;
    const current = b.id === state.branchId;
    return `
      <div class="branch-card ${current?'current':''}" data-id="${b.id}">
        <div class="bko">${b.ko}</div>
        <div class="ben">${b.en}</div>
        ${count > 0 ? `<div class="badge">· ${count} in cart · ${count}종</div>` : (current ? `<div class="badge">· Current 현재 지점</div>` : '')}
      </div>
    `;
  }).join("");
  grid.querySelectorAll(".branch-card").forEach(card => {
    card.addEventListener("click", () => {
      setBranch(card.dataset.id);
      closeBranchModal();
    });
  });
  document.getElementById("branchModal").classList.add("show");
}
function closeBranchModal() {
  document.getElementById("branchModal").classList.remove("show");
}

function itemKey(secId, item) {
  return secId + ":" + (item.plu || item.en);
}

function getPrice(secId, it) {
  const key = itemKey(secId, it);
  return state.prices[key] !== undefined ? state.prices[key] : it.price;
}

function setPrice(secId, it, newPrice) {
  const key = itemKey(secId, it);
  const clean = Math.max(0, Math.round(Number(newPrice) * 100) / 100) || 0;
  if (Math.abs(clean - it.price) < 0.001) {
    delete state.prices[key];
  } else {
    state.prices[key] = clean;
  }
  state.priceDate = new Date().toISOString().slice(0, 10);
  saveState();
  updatePriceHeader();
}

function updatePriceHeader() {
  const dateEl = document.getElementById("priceDate");
  if (dateEl) dateEl.textContent = state.priceDate;
  const edited = Object.keys(state.prices).length;
  const editedEl = document.getElementById("priceEditedCount");
  if (editedEl) editedEl.textContent = edited > 0 ? `· ${edited} edited / ${edited}개 수정됨` : "";
}

// 2026-06-09 사장님 지시: produce(야채)는 세부 카테고리로 나누지 말고 하나의 목록으로.
// 2026-09-20 전무님 지시: 김치·반찬 / 부자재 탭은 품목이 많아 상표·품목 칩으로 걸러볼 수 있게.
const CHIP_SECTIONS = ["ndmetc", "ndmgro", "ndmsupply"];
function renderSubcats() {
  const el = document.getElementById("subcats");
  if (!el) return;
  const sec = activeSection();
  if (!sec || !CHIP_SECTIONS.includes(sec.id) || !sec.enabled) {
    state.activeSub = "all";
    el.innerHTML = "";
    return;
  }
  const counts = { all: sec.items.length };
  for (const it of sec.items) counts[it.cat] = (counts[it.cat] || 0) + 1;
  if (!counts[state.activeSub]) state.activeSub = "all";
  const chips = [`<button class="chip ${state.activeSub==='all'?'active':''}" data-sub="all">전체 All<span class="count">${counts.all}</span></button>`];
  for (const c of SUBCAT_ORDER) {
    if (!counts[c]) continue;
    chips.push(`<button class="chip ${state.activeSub===c?'active':''}" data-sub="${c}">${SUBCAT_LABEL[c] || c}<span class="count">${counts[c]}</span></button>`);
  }
  if (chips.length <= 2) { state.activeSub = "all"; el.innerHTML = ""; return; }   // 분류가 하나뿐이면 칩 감춤
  el.innerHTML = chips.join("");
  el.querySelectorAll(".chip").forEach(c => {
    c.addEventListener("click", () => {
      state.activeSub = c.dataset.sub;
      saveState();
      renderSubcats();
      renderContent();
    });
  });
}

function filterItems(items) {
  const q = state.search.trim().toLowerCase();
  let filtered = state.activeSub === "all" ? items : items.filter(it => it.cat === state.activeSub);
  if (q) {
    filtered = filtered.filter(it =>
      it.en.toLowerCase().includes(q) ||
      it.ko.toLowerCase().includes(q) ||
      (it.plu && it.plu.includes(q)) ||
      (it.code && it.code.toLowerCase().includes(q))
    );
  }
  return filtered;
}

// ⭐ 정렬 스냅샷.
//   frozen=false → 렌더할 때마다 ⭐ 최상단으로 다시 정렬한다. 별표 데이터는 Firebase
//     에서 늦게 도착하므로(첫 렌더 때는 아직 비어있음) 도착 시점에 반드시 다시
//     정렬돼야 노랑 박스가 위로 올라온다.
//   frozen=true  → 사장님이 이 화면에서 별표를 직접 누른 뒤. 누른 카드가 발밑에서
//     맨 위로 튀어 다음 탭이 엉뚱한 제품에 들어가는 걸 막으려고 순서를 그대로 둔다.
//     탭·검색·추천필터가 바뀌면 sig 가 달라져 다시 풀리고 ⭐ 최상단으로 재정렬된다.
let recOrder = { sig: '', rank: null, frozen: false };

function renderContent() {
  const sec = activeSection();
  const main = document.getElementById("content");
  if (!sec.enabled) {
    main.innerHTML = `
      <div class="placeholder">
        <div class="emoji">🚧</div>
        <div><strong>${sec.label}</strong></div>
        <div class="hint">Section coming soon · 섹션 준비 중<br>Add the item list to enable ordering · 품목 추가 후 바로 주문 가능</div>
      </div>`;
    return;
  }
  let items = filterItems(sec.items);
  // 추천만 보기 — 오너 ⭐/BEST 마크가 있는 품목만. 다른 벤더 페이지와 동일 규칙.
  if (REC_FILTER_ON && window.kmRecs) {
    items = items.filter(it => window.kmRecs.isRecommended(itemKey(sec.id, it)));
  }
  // 2026-09-15 사장님 지시: ⭐ TOP PICK(빨강·금색 박스) 품목을 항상 목록 맨 위로,
  // 표시 없는 품목은 아래로. 중요한 것부터 바로 발주하도록. 전 벤더 탭 공통.
  //
  // 2026-09-16 버그수정: 별표를 누르면 kmRecs.notify → renderContent 가 즉시 돌아
  // 방금 누른 카드가 맨 위로 튀고 그리드 전체가 밀려서, 다음 탭이 엉뚱한 제품에
  // 들어갔음. → 순서는 "화면에 들어올 때 한 번"만 계산하고, 같은 화면에서 별표만
  // 토글하는 동안에는 그 순서를 그대로 유지한다. 탭/검색/추천필터가 바뀌면 재계산.
  if (window.kmRecs) {
    const keyOf = it => itemKey(sec.id, it);
    const sortSig = sec.id + '' + state.search.trim() + '' + (REC_FILTER_ON ? '1' : '0');
    if (recOrder.sig !== sortSig) recOrder = { sig: sortSig, rank: null, frozen: false };
    if (!recOrder.frozen || !recOrder.rank) {
      items = items
        .map((it, i) => [it, i])
        .sort((a, b) => {
          const ra = window.kmRecs.isRecommended(keyOf(a[0])) ? 0 : 1;
          const rb = window.kmRecs.isRecommended(keyOf(b[0])) ? 0 : 1;
          return ra - rb || a[1] - b[1];
        })
        .map(pair => pair[0]);
      const rank = new Map();
      items.forEach((it, i) => rank.set(keyOf(it), i));
      recOrder = { sig: sortSig, rank, frozen: recOrder.frozen };
    } else {
      const rank = recOrder.rank;
      const at = it => rank.has(keyOf(it)) ? rank.get(keyOf(it)) : Number.MAX_SAFE_INTEGER;
      items = items
        .map((it, i) => [it, i])
        .sort((a, b) => at(a[0]) - at(b[0]) || a[1] - b[1])
        .map(pair => pair[0]);
    }
  }
  if (items.length === 0) {
    main.innerHTML = sec.items.length === 0
      ? `<div class="empty-state">📋 제품 목록 준비 중 · Coming soon<br><small style="color:#9ca3af;display:block;margin-top:6px">이 벤더 제품 목록(엑셀·사진)을 추가하면 바로 발주 가능합니다</small></div>`
      : `<div class="empty-state">No results / 검색 결과가 없습니다</div>`;
    return;
  }
  // 2026-06-09 통일: 카테고리 그룹핑 없이 전체를 하나의 그리드로.
  const html = `<div class="items-grid">${items.map(it => itemHtml(sec.id, it)).join("")}</div>`;
  main.innerHTML = html;
  main.querySelectorAll(".item").forEach(el => bindItemEvents(el));
}

function itemHtml(secId, it) {
  const key = itemKey(secId, it);
  const qty = state.qty[key] || 0;
  const price = getPrice(secId, it);
  const edited = state.prices[key] !== undefined;
  const unitStr = it.unit ? escapeHtml(it.unit) : '';
  const pluStr = it.plu ? `<span class="plu">#${it.plu}</span>` : (it.code ? `<span class="plu ndmcode">${it.code}</span>` : '');
  // 📷 직원이 올린 사진이 있으면 그것을 먼저 (productImages/namdaemun/{키}), 없으면 원래 이미지
  const imgKey = it.code || key;
  const upImg  = window.kmImg ? (window.kmImg.get('namdaemun', imgKey) || '') : '';
  const shownImg = upImg || it.image || '';
  const imgBtn = window.kmImg ? window.kmImg.btnHtml('namdaemun', imgKey, !!shownImg) : '';
  const imgStr = shownImg
    ? `<div class="item-thumb"><img src="${escapeHtml(shownImg)}" alt="" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`
    : '';
  const hasBarcode = !!it.barcode;
  // 2026-06-10 사장님 지시: 가격 표시 제거 (가격 데이터는 유지, 화면에서만 숨김).
  const foot = `<div class="item-foot"><span class="unit">${unitStr}</span>${imgBtn}</div>` + (hasBarcode ? `<div class="barcode">${escapeHtml(it.barcode)}</div>` : '');
  const recTools  = window.kmRecs ? window.kmRecs.toggleHTML(key) : '';
  const recBadge  = window.kmRecs ? (window.kmRecs.badgeHTML(key) + window.kmRecs.noteHTML(key))  : '';
  const recRing   = window.kmRecs ? window.kmRecs.cardClass(key)  : '';
  // 🎯 발주 가이드 배너 — 수량 입력란 위. 탭하면 사장님 OVER 수량 자동입력.
  const overGuide = window.kmRecs ? window.kmRecs.orderGuideHTML(key, 'cs', "kmApplyOver('"+key+"',{q})") : '';
  // 🏬 헐리우드 경유 — 헐리우드 아닌 지점은 수량칸 대신 [헐리우드에 요청] (수량칸은 숨겨서 남김: bindItemEvents 가 찾음)
  const hubBlocked = window.kmHub ? window.kmHub.blocked('namdaemun', key) : false;
  const hubMark = window.kmHub ? (window.kmHub.badgeHTML('namdaemun', key) + window.kmHub.toggleHTML('namdaemun', key)) : '';
  return `
    <div class="item ${qty>0?'has-qty':''}${recRing}" data-key="${key}" style="position:relative">
      ${imgStr}
      <div class="item-head">
        <div class="name-en">${escapeHtml(it.en)}${recBadge}</div>
        ${pluStr}
      </div>
      <div class="name-ko">${escapeHtml(it.ko)}</div>
      ${recTools}
      ${foot}
      ${overGuide}
      ${hubMark}
      ${hubBlocked ? window.kmHub.requestHTML('namdaemun', key) : ''}
      <div class="qty-control"${hubBlocked ? ' style="display:none"' : ''}>
        <button class="qty-btn" data-act="dec">−</button>
        <input class="qty-input" type="number" min="0" step="1" value="${qty || ''}" placeholder="0">
        <button class="qty-btn" data-act="inc">+</button>
      </div>
    </div>`;
}

function sizePriceInput(inp) {
  const v = String(inp.value || '0');
  inp.setAttribute('size', Math.max(1, v.length));
}

function bindItemEvents(el) {
  const key = el.dataset.key;
  const input = el.querySelector(".qty-input");
  el.querySelector('[data-act="inc"]').addEventListener("click", () => {
    setQty(key, (state.qty[key] || 0) + 1);
    input.value = state.qty[key] || '';
    updateItemHighlight(el, key);
    updateSummary();
  });
  el.querySelector('[data-act="dec"]').addEventListener("click", () => {
    const next = Math.max(0, (state.qty[key] || 0) - 1);
    setQty(key, next);
    input.value = state.qty[key] || '';
    updateItemHighlight(el, key);
    updateSummary();
  });
  input.addEventListener("input", () => {
    const v = Math.max(0, Math.floor(Number(input.value) || 0));
    setQty(key, v);
    updateItemHighlight(el, key);
    updateSummary();
  });

  const priceInput = el.querySelector(".price-input");
  if (priceInput) {
    const ref = findItemByKey(key);
    sizePriceInput(priceInput);
    priceInput.addEventListener("focus", () => priceInput.select());
    priceInput.addEventListener("input", () => sizePriceInput(priceInput));
    priceInput.addEventListener("blur", () => {
      if (!ref) return;
      setPrice(ref.sec.id, ref.item, priceInput.value);
      priceInput.value = formatPrice(getPrice(ref.sec.id, ref.item));
      sizePriceInput(priceInput);
      el.querySelector(".price").classList.toggle("edited", state.prices[key] !== undefined);
    });
    priceInput.addEventListener("keydown", e => {
      if (e.key === "Enter") { priceInput.blur(); }
      if (e.key === "Escape") {
        if (ref) priceInput.value = formatPrice(getPrice(ref.sec.id, ref.item));
        sizePriceInput(priceInput);
        priceInput.blur();
      }
    });
  }

  // 카드 빈 영역 클릭 → 제품 상세 모달 (수량/별표/메모/가격 버튼은 제외)
  el.addEventListener("click", (e) => {
    if (e.target.closest('.qty-control') || e.target.closest('.km-rec-tools') ||
        e.target.closest('button') || e.target.closest('input')) return;
    openItemDetail(key);
  });
}

function findItemByKey(key) {
  const idx = key.indexOf(":");
  if (idx < 0) return null;
  const secId = key.slice(0, idx);
  const rest = key.slice(idx + 1);
  const sec = SECTIONS.find(s => s.id === secId);
  if (!sec) return null;
  const item = sec.items.find(it => (it.plu || it.en) === rest);
  return item ? { sec, item } : null;
}

// ===== PRODUCT DETAIL MODAL (제품 클릭 시 세부사항) =====
function openItemDetail(key) {
  const ref = findItemByKey(key);
  if (!ref) return;
  const it = ref.item;
  const qty = state.qty[key] || 0;
  const img = it.image
    ? '<div class="pd-img-wrap"><img src="' + escapeHtml(it.image) + '" onerror="this.style.display=\'none\'"></div>'
    : '<div class="pd-img-wrap"><div class="pd-noimg">📦</div></div>';
  const rows = [];
  rows.push(['품번 / PLU', it.plu ? '#' + escapeHtml(it.plu) : '-']);
  if (it.cat) rows.push(['분류 / Category', escapeHtml(it.cat)]);
  if (it.unit) rows.push(['단위 / Unit', escapeHtml(it.unit)]);
  if (it.barcode) rows.push(['바코드 / Barcode', escapeHtml(it.barcode)]);
  const tbl = '<table class="pd-table">' + rows.map(r => '<tr><td class="l">' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>').join('') + '</table>';
  document.getElementById('pdItemBody').innerHTML =
    img +
    '<div class="pd-name-en">' + escapeHtml(it.en) + '</div>' +
    (it.ko ? '<div class="pd-name-ko">' + escapeHtml(it.ko) + '</div>' : '') +
    tbl +
    '<div class="pd-qty">' +
      '<button onclick="pdItemBump(-1)">−</button>' +
      '<input type="number" min="0" id="pdItemQty" value="' + qty + '">' +
      '<button onclick="pdItemBump(1)">+</button>' +
      '<button class="pd-add" onclick="pdItemSave()">담기 / Save</button>' +
    '</div>';
  const m = document.getElementById('pdItemModal');
  m.dataset.key = key;
  m.classList.add('show');
}
function closeItemDetail() {
  const m = document.getElementById('pdItemModal');
  if (m) m.classList.remove('show');
}
function pdItemBump(d) {
  const inp = document.getElementById('pdItemQty');
  if (inp) inp.value = Math.max(0, (parseInt(inp.value, 10) || 0) + d);
}
function pdItemSave() {
  const m = document.getElementById('pdItemModal');
  const key = m.dataset.key;
  const n = Math.max(0, Math.floor(Number(document.getElementById('pdItemQty').value) || 0));
  setQty(key, n);
  document.querySelectorAll('.item').forEach(el => {
    if (el.dataset.key === key) {
      const inp = el.querySelector('.qty-input');
      if (inp) inp.value = n || '';
      updateItemHighlight(el, key);
    }
  });
  updateSummary();
  closeItemDetail();
  showToast(n > 0 ? ('✓ ' + n + ' 담음 / added') : '비움 / cleared');
}

function updateItemHighlight(el, key) {
  el.classList.toggle("has-qty", (state.qty[key] || 0) > 0);
}

function setQty(key, v) {
  // 🏬 헐리우드 경유 품목 — 헐리우드 아닌 지점은 늘릴 수 없다
  if (window.kmHub && window.kmHub.guard('namdaemun', key, Math.max(0, v || 0), state.qty[key] || 0)) return;
  if (v > 0) state.qty[key] = v;
  else delete state.qty[key];
  saveState();
}

// 🎯 2026-06-09 OVER 가이드 배너 탭 → 케이스 수량 자동입력 + UI 즉시 갱신.
//   namdaemun 은 setQty 가 input/highlight 를 안 건드려서 (bindItemEvents 가 담당)
//   배너 탭 전용 헬퍼로 한 번에 갱신.
window.kmApplyOver = function(key, qty){
  setQty(key, qty);
  try {
    const sel = (window.CSS && CSS.escape) ? CSS.escape(key) : key;
    const el = document.querySelector('.item[data-key="' + sel + '"]');
    if (el){
      const input = el.querySelector('.qty-input');
      if (input) input.value = state.qty[key] || '';
      updateItemHighlight(el, key);
    }
    updateSummary();
  } catch(e){ console.warn('kmApplyOver', e); }
};

// ============ SUMMARY ============
function getOrderLines() {
  const lines = [];
  for (const sec of SECTIONS) {
    if (!sec.enabled) continue;
    for (const it of sec.items) {
      const key = itemKey(sec.id, it);
      const q = state.qty[key];
      if (q && q > 0) lines.push({ section: sec.label, item: it, qty: q, key: key });
    }
  }
  return lines;
}

function updateSummary() {
  const lines = getOrderLines();
  const units = lines.reduce((a, l) => a + l.qty, 0);
  document.getElementById("totalCount").textContent = `${lines.length} items / ${lines.length}종`;
  document.getElementById("totalUnits").textContent = units > 0 ? `· ${units} units / ${units}개` : "";
  document.getElementById("openOrderBtn").disabled = lines.length === 0;
}

// ============ MODAL ============
function openOrderModal() {
  const lines = getOrderLines();
  const body = document.getElementById("orderList");
  if (!lines.length){
    body.innerHTML = '<div style="padding:24px 8px;text-align:center;color:#9ca3af;font-size:14px">' +
      '주문할 품목이 없습니다 / No items</div>';
  } else {
  body.innerHTML = lines.map(l => `
    <div class="order-line">
      <div>
        <div class="ol-name">${escapeHtml(l.item.en)}</div>
        <div class="ol-detail">${l.item.plu ? `#${l.item.plu} · ` : ''}${escapeHtml(l.item.ko)}${l.item.unit ? ' · ' + escapeHtml(l.item.unit) : ''}</div>
      </div>
      <div class="ol-ctl">
        <button type="button" class="ol-btn" onclick="ndmOrderBump('${escapeHtml(l.key).replace(/'/g, "\\'")}',-1)">−</button>
        <span class="ol-qty">${l.qty}</span>
        <button type="button" class="ol-btn" onclick="ndmOrderBump('${escapeHtml(l.key).replace(/'/g, "\\'")}',1)">+</button>
        <button type="button" class="ol-del" title="취소 / Remove" onclick="ndmOrderRemove('${escapeHtml(l.key).replace(/'/g, "\\'")}')">✕</button>
      </div>
    </div>
  `).join("");
  }
  const units = lines.reduce((a,l)=>a+l.qty,0);
  document.getElementById("modalTotal").textContent = `${lines.length} items · ${units} units`;
  const _ub = document.getElementById('ndmUndoBar');
  if (_ub && !__ndmUndo) _ub.style.display = 'none';
  document.getElementById("modal").classList.add("show");
}

// 🗑 주문 내역에서 바로 수량 조절·취소 (전무님 요청 2026-09-20)
//   주문서를 보다가 "이건 빼자" 를 화면을 옮기지 않고 처리한다.
let __ndmUndo = null;     // { key, qty } — 방금 취소한 것 되돌리기
function ndmOrderBump(key, d){
  const cur = +state.qty[key] || 0;
  const next = Math.max(0, Math.min(999, cur + d));
  if (next === cur) return;
  if (next === 0) delete state.qty[key]; else state.qty[key] = next;
  saveState();
  openOrderModal();
  if (typeof renderContent === 'function') renderContent();
  if (typeof updateSummary === 'function') updateSummary();
}
function ndmOrderRemove(key){
  const cur = +state.qty[key] || 0;
  if (!cur) return;
  const label = key.split(':').slice(1).join(':');
  if (!confirm('주문에서 빼시겠어요?\nRemove from the order?\n\n' + label + ' × ' + cur)) return;
  __ndmUndo = { key: key, qty: cur };
  delete state.qty[key];
  saveState();
  openOrderModal();
  if (typeof renderContent === 'function') renderContent();
  if (typeof updateSummary === 'function') updateSummary();
  const u = document.getElementById('ndmUndoBar');
  if (u){ u.style.display = ''; u.querySelector('.txt').textContent = label + ' × ' + cur + ' 취소함'; }
}
function ndmOrderUndo(){
  if (!__ndmUndo) return;
  state.qty[__ndmUndo.key] = (+state.qty[__ndmUndo.key] || 0) + __ndmUndo.qty;
  __ndmUndo = null;
  saveState();
  openOrderModal();
  if (typeof renderContent === 'function') renderContent();
  if (typeof updateSummary === 'function') updateSummary();
  const u = document.getElementById('ndmUndoBar'); if (u) u.style.display = 'none';
}
window.ndmOrderBump = ndmOrderBump; window.ndmOrderRemove = ndmOrderRemove; window.ndmOrderUndo = ndmOrderUndo;

function closeOrderModal() {
  document.getElementById("modal").classList.remove("show");
}

function orderAsText() {
  const lines = getOrderLines();
  const today = new Date().toISOString().slice(0,10);
  const branch = state.branchId ? BRANCH_BY_ID[state.branchId] : null;
  const header = branch ? `[남대문 주문 · ${branch.ko} / ${branch.en} · ${today}]` : `[남대문 주문 · ${today}]`;
  let out = `${header}\n\n`;
  for (const l of lines) {
    out += `${l.item.plu ? `#${l.item.plu} ` : ''}${l.item.en} (${l.item.ko})${l.item.unit ? ' ' + l.item.unit : ''} × ${l.qty}\n`;
  }
  out += `\n총 ${lines.length}종 / ${lines.reduce((a,l)=>a+l.qty,0)}개`;
  return out;
}

function orderAsCSV() {
  const lines = getOrderLines();
  const today = new Date().toISOString().slice(0,10);
  const branch = state.branchId ? BRANCH_BY_ID[state.branchId] : { ko: '', en: '' };
  const esc = (v) => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const header = `# Namdaemun Order / ${branch.ko} ${branch.en} / ${today}`;
  const cols = ["PLU", "Item (EN)", "Item (KO)", "Unit", "Qty"];
  const rows = lines.map(l => [l.item.plu || '', l.item.en, l.item.ko, l.item.unit || '', l.qty].map(esc).join(","));
  return `${header}\n${cols.join(",")}\n${rows.join("\n")}`;
}

function downloadCSV() {
  const csv = "\ufeff" + orderAsCSV();
  const today = new Date().toISOString().slice(0,10);
  const branch = state.branchId || "NOBRANCH";
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `namdaemun_${branch}_${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ✉️ 회사 메일로 보내기 — info@miamikimchi.com 으로 로그인된 지메일 작성창을 열고,
//   받는사람·제목·본문까지 채워 둔다. 전무님은 [보내기]만 누르면 된다(보낸메일함에도 남는다).
//   받는 사람 주소는 한 번 넣으면 기억하고, 다음부터는 확인만 하면 된다.
//   ⚠️ 주소창 길이 제한이 있어 본문이 길면 클립보드에 복사해 붙여넣게 안내한다.
const NDM_MAIL_FROM = 'info@miamikimchi.com';
const NDM_MAIL_KEY  = 'ndm_order_email_to';
function sendEmail() {
  const lines = getOrderLines();
  if (!lines.length){ alert('주문할 품목이 없습니다 / No items'); return; }
  let to = '', via = 'gmail';
  try { to = localStorage.getItem(NDM_MAIL_KEY) || ''; via = localStorage.getItem('ndm_mail_via') || 'gmail'; } catch(e){}

  const today = new Date().toISOString().slice(0,10);
  const branch = state.branchId ? BRANCH_BY_ID[state.branchId] : null;
  const subject = branch ? `[남대문 주문] ${branch.ko} - ${today}` : `[남대문 주문] ${today}`;
  const body = orderAsText();

  const old = document.getElementById('ndmMailOv'); if (old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'ndmMailOv';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  const btn = (id, label, sub, main) =>
    '<button type="button" id="' + id + '" style="display:block;width:100%;text-align:left;border:1.5px solid ' + (main ? '#dc2626' : '#d1d5db') + ';' +
    'background:' + (main ? '#fef2f2' : '#fff') + ';border-radius:10px;padding:11px 13px;margin-top:8px;cursor:pointer;font-family:inherit">' +
    '<div style="font-weight:800;font-size:14px;color:#111">' + label + '</div>' +
    '<div style="font-size:11.5px;color:#6b7280;margin-top:2px">' + sub + '</div></button>';
  ov.innerHTML =
    '<div style="background:#fff;border-radius:14px;max-width:400px;width:100%;padding:18px">' +
      '<div style="font-weight:800;font-size:16px;margin-bottom:10px">✉️ 주문서 메일 보내기</div>' +
      '<label style="font-size:12px;font-weight:700;color:#374151">받는 사람 (남대문) / To</label>' +
      '<input id="ndmMailTo" type="email" value="' + escapeHtml(to) + '" placeholder="order@…" ' +
        'style="width:100%;box-sizing:border-box;margin-top:4px;padding:9px 10px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px">' +
      btn('ndmViaGmail', '📧 지메일 (info@miamikimchi.com)', '회사 지메일 작성창이 채워진 채로 열립니다', via === 'gmail') +
      btn('ndmViaApp',   '📨 아웃룩 · 기본 메일 앱', '이 컴퓨터의 메일 앱(아웃룩 등)으로 엽니다 — 지메일 로그인이 막혔을 때', via === 'app') +
      '<button type="button" id="ndmMailCancel" style="width:100%;margin-top:10px;border:0;background:#f3f4f6;border-radius:8px;padding:9px;cursor:pointer;font-family:inherit">취소 / Cancel</button>' +
    '</div>';
  document.body.appendChild(ov);
  const inp = ov.querySelector('#ndmMailTo');
  setTimeout(() => { try { inp.focus(); } catch(e){} }, 50);
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#ndmMailCancel').onclick = () => ov.remove();

  function remember(v){
    to = String(inp.value || '').trim();
    try { localStorage.setItem(NDM_MAIL_KEY, to); localStorage.setItem('ndm_mail_via', v); } catch(e){}
  }
  // 📧 지메일 — 버튼 클릭 순간에 바로 새 창을 연다(팝업 차단 없음)
  ov.querySelector('#ndmViaGmail').onclick = () => {
    remember('gmail');
    const longBody = encodeURIComponent(body).length > 1800;   // 주소창 길이 한계
    if (longBody){ try { navigator.clipboard.writeText(body); } catch(e){} }
    const url = 'https://mail.google.com/mail/?authuser=' + encodeURIComponent(NDM_MAIL_FROM) +
      '&view=cm&fs=1&tf=1&to=' + encodeURIComponent(to) +
      '&su=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(longBody ? '(주문 내용이 길어 클립보드에 복사했습니다. 이 줄을 지우고 Ctrl+V 로 붙여넣어 주세요.)' : body);
    const w = window.open(url, '_blank');
    if (!w) window.location.href = url;
    ov.remove();
    showToast(longBody ? '주문 내용을 복사했습니다 — 지메일 본문에 Ctrl+V' : '지메일 작성창을 열었습니다 — 보내기만 누르세요');
  };
  // 📨 아웃룩·기본 메일 앱 — 전무님 아웃룩은 이미 info@miamikimchi.com 으로 로그인돼 있다
  ov.querySelector('#ndmViaApp').onclick = () => {
    remember('app');
    ov.remove();
    window.location.href = 'mailto:' + encodeURIComponent(to) +
      '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  };
}

// ============ UTIL ============
function formatPrice(n) {
  if (!n && n !== 0) return "0";
  const rounded = Math.round(n * 100) / 100;
  return rounded.toLocaleString("en-US", { minimumFractionDigits: rounded % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value;
  document.getElementById("searchClear").classList.toggle("show", state.search.length > 0);
  renderContent();
});

  const msg = "Order copied / 주문서 복사됨";
  try {
    await navigator.clipboard.writeText(orderAsText());
    showToast(msg);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = orderAsText();

    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);

// 🖨 주문서 인쇄 — 창을 하나 띄워 표로 그리고 바로 인쇄. 팝업이 막히면 알려준다.
function printOrder(){
  const lines = getOrderLines();
  if (!lines.length){ alert('주문할 품목이 없습니다 / No items'); return; }
  const today = new Date();
  const d = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const b = state.branchId ? BRANCH_BY_ID[state.branchId] : null;
  const branch = b ? (b.ko + ' / ' + b.en) : '';
  const who = (function(){ try { return (JSON.parse(localStorage.getItem('chat.me')||'null')||{}).name || ''; } catch(e){ return ''; } })();
  const units = lines.reduce((a,l)=>a+l.qty,0);
  const esc = escapeHtml;
  const rows = lines.map((l,i) => '<tr>' +
      '<td class="n">' + (i+1) + '</td>' +
      '<td>' + esc(l.item.plu || l.item.code || '') + '</td>' +
      '<td><b>' + esc(l.item.en) + '</b><div class="ko">' + esc(l.item.ko || '') + '</div></td>' +
      '<td>' + esc(l.item.unit || '') + '</td>' +
      '<td class="q">' + l.qty + '</td>' +
      '<td class="chk"></td></tr>').join('');
  const html = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>남대문 주문서 ' + d + '</title><style>' +
    '@page{size:A4;margin:12mm}' +
    'body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",Arial,sans-serif;color:#111;margin:0}' +
    'h1{font-size:18px;margin:0 0 2px}.sub{font-size:12px;color:#555;margin-bottom:10px}' +
    'table{width:100%;border-collapse:collapse;font-size:12px}' +
    'th,td{border:1px solid #999;padding:5px 6px;vertical-align:top}' +
    'th{background:#f1f1f1;font-size:11px}' +
    'td.n{width:26px;text-align:center;color:#666}td.q{width:46px;text-align:center;font-weight:800;font-size:14px}' +
    'td.chk{width:34px}.ko{color:#555;font-size:11px;margin-top:1px}' +
    '.foot{margin-top:10px;font-size:12px;display:flex;justify-content:space-between}' +
    'tr{break-inside:avoid}' +
    '</style></head><body>' +
    '<h1>남대문 주문서 / Namdaemun Order</h1>' +
    '<div class="sub">' + esc(branch) + ' · ' + d + (who ? ' · ' + esc(who) : '') + ' · ' + lines.length + '종 / ' + units + '개</div>' +
    '<table><thead><tr><th>#</th><th>품번<br>Item #</th><th>상품명 / Item</th><th>규격<br>Spec</th><th>수량<br>Qty</th><th>확인<br>✓</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<div class="foot"><span>주문자 / Ordered by: ' + esc(who || '______') + '</span><span>확인 / Checked: ____________</span></div>' +
    '</body></html>';
  const w = window.open('', '_blank');
  if (!w){ alert('팝업이 막혀 있습니다. 주소창 옆에서 팝업 허용을 켜주세요.\nPlease allow pop-ups to print.'); return; }
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(function(){ try { w.print(); } catch(e){} }, 350);
}
document.getElementById("printBtn").addEventListener("click", printOrder);

document.getElementById("clearBtn").addEventListener("click", () => {
  const b = state.branchId ? BRANCH_BY_ID[state.branchId] : null;
  const label = b ? `${b.en} / ${b.ko}` : "this branch / 현재 지점";
  // 🛡️ 2026-06-08: 공유 카트 보호 — 강화된 confirm + localStorage 백업.
  const types = Object.keys(state.qty || {}).length;
  const units = Object.values(state.qty || {}).reduce((s,n)=>s+(+n||0),0);
  if (!types){ showToast("이미 비어있음"); return; }
  const warn = `⚠️ 공유 주문 카트입니다.\n\n[${label}] 의 다른 매니저·직원이 추가한 모든 주문이 사라집니다:\n  · ${types}종 / ${units}개 품목\n\n정말 전체를 비우시겠어요?\n(비우기 전 자동 백업)`;
  if (!confirm(warn)) return;
  try {
    const ts = String(Date.now());
    const bid = state.branchId || 'UNASSIGNED';
    const histKey = `ndm_cart_v1_history__${bid}__${ts}`;
    localStorage.setItem(histKey, JSON.stringify({ ts:+ts, types, units, cart: state.qty }));
  } catch(e){ console.warn('namdaemun clear backup failed', e); }
  state.qty = {};
  saveState();
  closeOrderModal();
  renderContent();
  updateSummary();
  showToast("Order cleared / 주문 초기화됨 (백업 보관)");
});

<!-- Firebase + kmRecs wiring so the TOP PICK yellow-box marks sync across
     all staff devices, same as hanmi/wismettac/rheebros. -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getDatabase, ref, set, get, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4",
  authDomain: "kimchi-mart-order.firebaseapp.com",
  databaseURL: "https://kimchi-mart-order-default-rtdb.firebaseio.com",
  projectId: "kimchi-mart-order",
  storageBucket: "kimchi-mart-order.firebasestorage.app",
  messagingSenderId: "640942647201",
  appId: "1:640942647201:web:1e3421fb55c89155230de0"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

if (window.kmRecs){
  window.kmRecs.init({
    db, ref, set, onValue, remove,
    vendor: 'namdaemun',
    branch: (function(){ try { return localStorage.getItem('km_branch') || ''; } catch(e){ return ''; } })()
  });
  // 사장님이 이 화면에서 ⭐/BEST 를 직접 누른 경우에만 현재 순서를 잠근다.
  // (누른 카드가 곧장 맨 위로 튀어 그리드가 밀리면 다음 탭이 엉뚱한 제품에 들어감)
  // 서버에서 별표 데이터가 도착해서 나는 재렌더는 잠그지 않으므로, 노랑 박스는
  // 데이터가 오는 즉시 맨 위로 올라온다. 탭·검색·필터를 바꾸면 잠금이 풀린다.
  ['toggleGlobal', 'toggleBest'].forEach(fn => {
    const orig = window.kmRecs[fn];
    if (typeof orig !== 'function') return;
    window.kmRecs[fn] = function () {
      if (typeof recOrder !== 'undefined' && recOrder.rank) recOrder.frozen = true;
      return orig.apply(window.kmRecs, arguments);
    };
  });
  window.kmRecs.subscribe(() => {
    try { if (typeof renderContent === 'function') renderContent(); } catch(e){}
  });
}
// 🛒 주문 수량 폰↔PC 공유 (2026-09-20 전무님 요청)
//   같은 지점이면 폰에서 담은 수량이 PC 에도, PC 에서 담은 것이 폰에도 보인다.
//   한미·이브라더스와 같은 경로 방식: carts/{벤더}/{지점}/_shared.
//   키에 . # $ [ ] / 가 들어갈 수 있어(영문 상품명) %XX 로 인코딩해 저장한다.
(function(){
  var unsubCart = null, applyingRemote = false, pushTimer = null;
  function encK(k){ return String(k).replace(/[.#$\[\]\/]|%(?![0-9A-Fa-f]{2})/g,
    function(ch){ return '%' + ch.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0'); }); }
  function decK(k){ try { return decodeURIComponent(k); } catch(e){ return k; } }
  function branchNow(){ try { return localStorage.getItem('km_branch') || ''; } catch(e){ return ''; } }
  function cartPath(b){ return 'carts/namdaemun/' + b + '/_shared'; }

  window.__ndmPushCart = function(qty){
    if (applyingRemote) return;                       // 클라우드에서 받은 것을 도로 올리지 않는다
    var b = branchNow(); if (!b) return;
    var clean = {};
    Object.keys(qty || {}).forEach(function(k){ var v = +qty[k] || 0; if (v > 0) clean[encK(k)] = v; });
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){                // 연타(+ 버튼)는 모아서 한 번만
      set(ref(db, cartPath(b)), clean).catch(function(e){ console.warn('[ndm-cart] push', e && e.message); });
    }, 400);
  };

  function applyRemote(remote){
    var next = {};
    Object.keys(remote || {}).forEach(function(k){ var v = +remote[k] || 0; if (v > 0) next[decK(k)] = v; });
    next = migrateQty(next);   // 옛 이름으로 저장된 수량도 이어받는다
    var localN = Object.keys(state.qty || {}).length, remoteN = Object.keys(next).length;
    // 🛡 빈 클라우드가 로컬을 지우지 않게 — 오히려 내 것을 올린다 (2026-06-18 사고 재발 방지)
    if (!remoteN && localN){ window.__ndmPushCart(state.qty); return; }
    if (JSON.stringify(next) === JSON.stringify(state.qty)) return;
    applyingRemote = true;
    try {
      state.qty = next;
      try { localStorage.setItem(cartKey(state.branchId, _userKey()), JSON.stringify(state.qty)); } catch(e){}
      if (typeof renderContent === 'function') renderContent();
      if (typeof updateSummary === 'function') updateSummary();
    } finally { applyingRemote = false; }
  }

  function subscribeCart(){
    if (unsubCart){ try { unsubCart(); } catch(e){} unsubCart = null; }
    var b = branchNow(); if (!b) return;
    unsubCart = onValue(ref(db, cartPath(b)), function(snap){ applyRemote(snap.val() || {}); },
      function(err){ console.warn('[ndm-cart] read', err && err.message); });
  }
  window.__ndmCartResub = subscribeCart;
  subscribeCart();
  window.addEventListener('storage', function(e){ if (e.key === 'km_branch') subscribeCart(); });
  onAuthStateChanged(auth, function(u){ if (u) subscribeCart(); });   // 로그인 토큰이 늦게 오면 다시
})();

// 📷 상품 사진 — 올리면 5개 지점이 같이 본다
if (window.kmImg){
  const storage = getStorage(app, 'gs://kimchi-mart-order.firebasestorage.app');
  window.kmImg.init({ db, ref, set, get, onValue, remove, storage, sRef, uploadBytes, getDownloadURL });
  window.kmImg.subscribe(() => { try { if (typeof renderContent === 'function') renderContent(); } catch(e){} });
}
// 🏬 헐리우드 경유 품목
if (window.kmHub){
  window.kmHub.init({ db, ref, set, onValue });
  window.kmHub.config({ vendorName: 'Namdaemun', vendorNameKr: '남대문', lookup: (v, key) => { const r = findItemByKey(key); if (!r) return null; const it = r.item; return { name: it.en || it.ko, nameKr: it.ko || '', unit: it.unit || '', barcode: it.barcode || '', image: it.image || '' }; } });
  window.kmHub.subscribe(() => { try { if (typeof renderContent === 'function') renderContent(); } catch(e){} });
}
// Re-subscribe once the user's auth token is restored from IndexedDB —
// otherwise the very first read can race ahead of auth and silently fail.
onAuthStateChanged(auth, (user) => {
  if (user && window.kmRecs) window.kmRecs.refresh();
});
</script>
